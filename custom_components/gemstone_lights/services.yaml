play_library_pattern:
  name: Play library pattern
  description: Play a pattern from Gemstone's official library by name. The library
    holds well over a thousand patterns, far more than a dropdown can offer, so this
    is the way to reach any of them from an automation.
  target:
    entity:
      integration: gemstone_lights
      domain: light
  fields:
    pattern:
      name: Pattern
      description: The pattern's name, exactly as it appears in the Gemstone app.
      required: true
      example: Happy New Year
      selector:
        text: null
    folder:
      name: Folder
      description: Optional. Restricts the search to one library folder, useful when
        the same pattern name appears in more than one.
      required: false
      example: sports / NFL
      selector:
        text: null
play_by_name:
  name: Play by name
  description: Play a saved design or pattern (such as Glamo WW) by name, or a library
    pattern when nothing saved matches. Target several controller lights to start
    them all at once.
  target:
    entity:
      integration: gemstone_lights
      domain: light
  fields:
    name:
      name: Name
      description: The name as shown in the Design or Pattern dropdown, for example
        "Glamo WW" or "Glamo WW (Holiday)".
      required: true
      example: Glamo WW
      selector:
        text: null
    folder:
      name: Folder
      description: Optional. Only consider saved patterns or library patterns in this
        folder.
      required: false
      selector:
        text: null
save_content:
  name: Save local content
  description: Create or replace a pattern, design or zone in Home Assistant. Vendor
    catalogs are unchanged.
  fields:
    controller:
      name: Controller
      description: Select the whole-controller light.
      required: true
      selector:
        entity:
          integration: gemstone_lights
          domain: light
    kind:
      name: Kind
      description: pattern, design or zone
      required: true
      selector:
        select:
          options:
          - pattern
          - design
          - zone
    name:
      name: Name
      description: Saving the same name replaces the local item.
      required: true
      selector:
        text: {}
    content:
      name: Content
      description: Pattern/design object, or a zone object with inclusive start and
        end pixel indices (0–4095).
      required: true
      selector:
        object: {}
    folder:
      name: Folder
      description: Optional label for a saved pattern.
      required: false
      selector:
        text: {}
delete_content:
  name: Delete local content
  description: Delete a local item. An imported vendor item with the same name becomes
    visible again.
  fields:
    controller:
      name: Controller
      description: Select the whole-controller light.
      required: true
      selector:
        entity:
          integration: gemstone_lights
          domain: light
    kind:
      name: Kind
      description: The type of item to delete.
      required: true
      selector:
        select:
          options:
          - pattern
          - design
          - zone
    name:
      name: Name
      description: The local name to delete.
      required: true
      selector:
        text: {}
export_catalog:
  name: Export catalog
  description: Return patterns, designs, zones and downloaded library content for
    a portable local backup.
  fields:
    controller:
      name: Controller
      description: Select the whole-controller light.
      required: true
      selector:
        entity:
          integration: gemstone_lights
          domain: light
import_catalog:
  name: Import catalog
  description: Merge a version 1 export into local storage. Matching names are replaced
    after the entire input validates.
  fields:
    controller:
      name: Controller
      description: Select the whole-controller light.
      required: true
      selector:
        entity:
          integration: gemstone_lights
          domain: light
    catalog:
      name: Catalog
      description: The object returned by Export catalog.
      required: true
      selector:
        object: {}
backup_favorites:
  name: Back up favorites
  description: Save this controller's patterns, designs and zones to a file in
    gemstone_backups in the Home Assistant config folder. Returns the file name.
  fields:
    controller:
      name: Controller
      description: Select the whole-controller light.
      required: true
      selector:
        entity:
          integration: gemstone_lights
          domain: light
restore_favorites:
  name: Restore favorites
  description: Merge a file from gemstone_backups back into this controller's
    patterns, designs and zones. Matching names are replaced.
  fields:
    controller:
      name: Controller
      description: Select the whole-controller light.
      required: true
      selector:
        entity:
          integration: gemstone_lights
          domain: light
    file:
      name: File
      description: Backup file name. Leave empty for this controller's newest backup.
      required: false
      example: backside-20261231-120000.json
      selector:
        text: null
save_current:
  name: Save current content
  description: Save the current pattern, solid color or design to the local catalog.
  fields:
    controller:
      name: Controller
      description: Select the whole-controller light.
      required: true
      selector:
        entity:
          integration: gemstone_lights
          domain: light
    name:
      name: Name
      description: Name for the saved pattern or design.
      required: true
      selector:
        text: {}
play_content:
  name: Play custom content
  description: Play a pattern or design object without saving it. Patterns may target
    a zone; designs require the whole controller.
  fields:
    kind:
      name: Kind
      description: pattern or design
      required: true
      selector:
        select:
          options:
          - pattern
          - design
    content:
      name: Content
      description: The pattern or design object to play.
      required: true
      selector:
        object: {}
  target:
    entity:
      integration: gemstone_lights
      domain: light
soft_reboot:
  name: Soft reboot controller
  description: Request a cloud soft reboot. Requires the cloud access option; the
    controller may be unreachable for about one minute.
  fields:
    controller:
      name: Controller
      description: Select the whole-controller light, even if it is unavailable.
      required: true
      selector:
        entity:
          integration: gemstone_lights
          domain: light
